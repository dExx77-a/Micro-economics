<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Micro Study</title>
<style>
:root{--bg:#F2F5F8;--card:#fff;--ink:#17263B;--muted:#55657A;--line:#D5DDE6;--demand:#2B5FD9;--supply:#0F8B7A;--eq:#D99A00;--bad:#C23B3B}
@media (prefers-color-scheme:dark){:root{--bg:#121B28;--card:#1B2738;--ink:#E8EEF5;--muted:#9FB0C4;--line:#2E3D52;--demand:#6B9BFF;--supply:#3FCDB8;--eq:#F0B93A;--bad:#F08080}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.6 system-ui,-apple-system,"Segoe UI",sans-serif}
header{padding:16px 20px;border-bottom:1px solid var(--line)}
.brand{display:inline-flex;align-items:center;gap:10px;color:var(--ink);text-decoration:none;font:700 22px Georgia,"Times New Roman",serif}
main{max-width:720px;margin:0 auto;padding:28px 20px 60px}
h1,h2,h3{font-family:Georgia,"Times New Roman",serif;line-height:1.25}
h1{font-size:2rem;margin:.2em 0 .4em}
a{color:var(--demand)}
.chlist{display:grid;gap:12px;margin-top:20px}
.chlist a{display:block;background:var(--card);border:1px solid var(--line);border-left:5px solid var(--demand);border-radius:8px;padding:14px 16px;text-decoration:none;color:var(--ink)}
.chlist a:hover,.chlist a:focus-visible{border-left-color:var(--eq)}
.chlist small{display:block;color:var(--muted)}
.tabs{display:flex;flex-wrap:wrap;gap:6px;margin:18px 0 22px;border-bottom:1px solid var(--line)}
.tabs a{padding:8px 14px;text-decoration:none;color:var(--muted);border-bottom:3px solid transparent}
.tabs a.on{color:var(--ink);border-bottom-color:var(--supply);font-weight:600}
.panel{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:22px}
.panel h2{margin-top:0}
.term{border-top:1px solid var(--line);padding-top:10px;margin-top:10px}
.example{border-left:4px solid var(--eq);padding:2px 0 2px 14px;margin:16px 0}
.count{color:var(--muted);margin:0 0 6px}
.opts{display:grid;gap:10px;margin:16px 0}
button{font:inherit;cursor:pointer;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink);padding:11px 14px;text-align:left}
button:hover:not(:disabled){border-color:var(--demand)}
button:focus-visible,a:focus-visible{outline:3px solid var(--eq);outline-offset:2px}
button.right{border-color:var(--supply);background:color-mix(in srgb,var(--supply) 18%,var(--card))}
button.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 16%,var(--card))}
button.primary{background:var(--demand);border-color:var(--demand);color:#fff;text-align:center}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.card{min-height:190px;display:flex;align-items:center;justify-content:center;text-align:center;font:1.25rem/1.4 Georgia,serif;padding:24px;width:100%}
.card.back{background:color-mix(in srgb,var(--supply) 14%,var(--card));font:1.05rem/1.5 system-ui,sans-serif}
.note{color:var(--muted);font-size:.95rem}
@media (prefers-reduced-motion:no-preference){button{transition:border-color .15s,background .15s}}

.examtop{position:sticky;top:0;z-index:5;display:flex;gap:14px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:10px 14px;margin-bottom:14px}
.examtop strong{font:700 1.3rem Georgia,"Times New Roman",serif;font-variant-numeric:tabular-nums}
.low{color:var(--bad)}
button.picked{border-color:var(--demand);background:color-mix(in srgb,var(--demand) 16%,var(--card))}
.nav{display:flex;flex-wrap:wrap;gap:6px;margin-top:16px}
.nav button{min-width:42px;padding:6px 8px;text-align:center}
.nav button.ans{background:color-mix(in srgb,var(--supply) 18%,var(--card));border-color:var(--supply)}
.nav button.cur{outline:3px solid var(--eq)}
.rev{margin-top:12px}
.chlist a.exam{border-left-color:var(--supply)}
button:disabled{opacity:.5;cursor:default}

</style>
</head>

function home(){
  app.innerHTML = `<h1>Microeconomics</h1><p class="note">Pick a chapter to read the summary, flip flashcards or take a quiz.</p>
  <div class="chlist">${dailyCard()}<a class="exam" href="#exam"><strong>Teacher’s questions exam</strong><small>${examPool().length} multiple choice questions in 2 hours. Answers are shown at the end.</small></a>${CHAPTERS.map(c=>{
    const s = ["quiz","tf"].map(k=>store.get(c.id+":"+k)).filter(Boolean);
    return `<a href="#${c.id}/summary"><strong>${c.title}</strong><small>${c.blurb}${s.length?" Best scores saved.":""}</small></a>`;
  }).join("")}</div>`;
}

function chapter(ch, tab){
  app.innerHTML = `<a href="#">All chapters</a><h1>${ch.title}</h1>
  <nav class="tabs">${tabsFor(ch).map(([k,l])=>`<a href="#${ch.id}/${k}" class="${k===tab?"on":""}">${l}</a>`).join("")}</nav>
  <section class="panel" id="panel"></section>`;
  const panel = document.getElementById("panel");
  if(tab==="cards") cards(ch,panel);
  else if(tab==="quiz") quiz(ch,"quiz",ch.mc,panel);
  else if(tab==="practice" && ch.practice) quiz(ch,"practice",ch.practice,panel);
  else if(tab==="tf") quiz(ch,"tf",ch.tf.map(q=>({q:q.q,options:["True","False"],answer:q.answer?0:1,why:q.why})),panel);
  else summary(ch,panel);
}

function summary(ch,p){
  p.innerHTML = `<h2>Key ideas</h2>${ch.summary.map(t=>`<p>${t}</p>`).join("")}
  <h2>Real-life examples</h2>${ch.examples.map(e=>`<div class="example"><strong>${e.t}</strong><br>${e.d}</div>`).join("")}`;
}

function cards(ch,p){
  const total = ch.cards.length;
  let queue = shuffle(ch.cards), known = 0, back = false;
  const draw = () => {
    if(!queue.length){
      p.innerHTML = `<h2>All ${total} cards known</h2><p class="note">Every card is out of the pile.</p><div class="row"><button id="again" class="primary">Start over</button></div>`;
      document.getElementById("again").onclick = () => { queue = shuffle(ch.cards); known = 0; back = false; draw(); };
      return;
    }
    const c = queue[0];
    p.innerHTML = `<p class="count">${known} of ${total} known, ${queue.length} left in the pile</p>
    <button class="card ${back?"back":""}" id="flip" aria-label="Flip card">${back?c.a:c.q}</button>
    ${back ? `<p class="note">Did you get it right?</p><div class="row"><button id="miss">I got it wrong</button><button id="hit" class="primary">I got it right</button></div>` : `<p class="note">Think of the answer, then tap the card to flip it.</p>`}`;
    document.getElementById("flip").onclick = () => { back = !back; draw(); };
    if(back){
      document.getElementById("hit").onclick = () => { queue.shift(); known++; back = false; draw(); };
      document.getElementById("miss").onclick = () => { queue.push(queue.shift()); back = false; draw(); };
    }
  };
  draw();
}

function quiz(ch,kind,pool,p){
  const key = ch.id+":"+kind;
  let list = shuffle(pool), i = 0, score = 0, missed = [], full = true;
  const show = () => {
    if(i>=list.length) return done();
    const q = list[i];
    const base = q.options.map((t,n)=>({t, ok:n===q.answer}));
    const o = (kind==="tf" || q.options.some(t=>/\b(above|these|first two)\b|^(none|all|both) of/i.test(t))) ? base : shuffle(base);
    p.innerHTML = `<p class="count">Question ${i+1} of ${list.length}</p><h2>${q.q}</h2>
    <div class="opts">${o.map((x,n)=>`<button data-n="${n}">${x.t}</button>`).join("")}</div><div id="fb" aria-live="polite"></div>`;
    p.querySelectorAll(".opts button").forEach(b => b.onclick = () => {
      const x = o[b.dataset.n];
      p.querySelectorAll(".opts button").forEach((bb,n)=>{ bb.disabled=true; if(o[n].ok) bb.classList.add("right"); });
      if(x.ok) score++; else { b.classList.add("wrong"); missed.push(q); }
      document.getElementById("fb").innerHTML = `<p><strong>${x.ok?"Correct.":"Not quite."}</strong> ${q.why}</p><button class="primary" id="nx">${i+1<list.length?"Next question":"See score"}</button>`;
      document.getElementById("nx").onclick = () => { i++; show(); };
    });
  };
  const done = () => {
    let best = (store.get(key)||{}).best || 0;
    if(full){ best = Math.max(best,score); store.set(key,{best,total:list.length}); }
    p.innerHTML = `<h2>You got ${score} of ${list.length}</h2>${full?`<p class="note">Best score: ${best} of ${list.length}</p>`:""}
    <div class="row">${missed.length?`<button id="rm" class="primary">Retry the ${missed.length} you missed</button>`:""}<button id="again">Start over</button></div>`;
    if(missed.length) document.getElementById("rm").onclick = () => { list=shuffle(missed); i=0; score=0; missed=[]; full=false; show(); };
    document.getElementById("again").onclick = () => { list=shuffle(pool); i=0; score=0; missed=[]; full=true; show(); };
  };
  show();
}

const EXAM_SECONDS = 7200;
let tick = null;

function examPool(){
  return CHAPTERS.flatMap(c => (c.practice||[]).map((q,i) => Object.assign({}, q, {id: c.id+"-"+i, chTitle: c.title})));
}

function examHome(){
  const n = examPool().length, saved = store.get("exam:state"), last = store.get("exam:last");
  const buttons = saved && !saved.done
    ? `<button class="primary" id="resume">Resume exam</button><button id="start">Start a new exam</button>`
    : saved && saved.done
    ? `<button class="primary" id="start">Start a new exam</button><button id="review">See last results</button>`
    : `<button class="primary" id="start">Start exam</button>`;
  app.innerHTML = `<a href="#">All chapters</a><h1>Teacher’s questions exam</h1>
  <section class="panel"><p>${n} multiple choice questions taken from your teacher’s class quizzes, chapters 1 to 4, in random order. You have 2 hours. The clock keeps running if you leave the page, and answers and explanations appear only after you finish.</p>
  ${last ? `<p class="note">Last result: ${last.score} of ${last.total} on ${last.date}.</p>` : ""}
  <div class="row">${buttons}</div></section>`;
  const st = document.getElementById("start");
  st.onclick = () => {
    if(saved && !saved.done && !confirm("This will discard your exam in progress. Start a new one?")) return;
    const now = Date.now();
    const state = {order: shuffle(examPool()).map(q=>q.id), answers: {}, i: 0, start: now, end: now + EXAM_SECONDS*1000, done: false};
    store.set("exam:state", state);
    exam(state);
  };
  const rs = document.getElementById("resume"); if(rs) rs.onclick = () => exam(saved);
  const rv = document.getElementById("review"); if(rv) rv.onclick = () => examResult(saved);
}

function exam(state){
  const byId = Object.fromEntries(examPool().map(q=>[q.id,q]));
  const n = state.order.length;
  const left = () => Math.max(0, Math.round((state.end-Date.now())/1000));
  const fmt = s => [Math.floor(s/3600), Math.floor(s%3600/60), s%60].map(x=>String(x).padStart(2,"0")).join(":");
  const save = () => store.set("exam:state", state);
  const finish = () => { clearInterval(tick); state.done = true; state.finished = Math.min(Date.now(), state.end); save(); examResult(state); };
  const draw = () => {
    const q = byId[state.order[state.i]];
    const answered = Object.keys(state.answers).length;
    app.innerHTML = `<div class="examtop"><strong id="clock">${fmt(left())}</strong><span>${answered} of ${n} answered</span><button id="finish">Finish exam</button></div>
    <section class="panel"><p class="count">Question ${state.i+1} of ${n}</p><h2>${q.q}</h2>
    <div class="opts">${q.options.map((t,k)=>`<button data-k="${k}" class="${state.answers[q.id]===k?"picked":""}">${t}</button>`).join("")}</div>
    <div class="row"><button id="prev" ${state.i===0?"disabled":""}>Previous</button><button id="next" class="primary" ${state.i===n-1?"disabled":""}>Next</button></div></section>
    <div class="nav">${state.order.map((id,k)=>`<button data-j="${k}" class="${k===state.i?"cur":""} ${id in state.answers?"ans":""}">${k+1}</button>`).join("")}</div>`;
    app.querySelectorAll("[data-k]").forEach(b => b.onclick = () => { state.answers[q.id] = Number(b.dataset.k); save(); draw(); });
    app.querySelectorAll("[data-j]").forEach(b => b.onclick = () => { state.i = Number(b.dataset.j); save(); draw(); window.scrollTo(0,0); });
    document.getElementById("prev").onclick = () => { state.i--; save(); draw(); window.scrollTo(0,0); };
    document.getElementById("next").onclick = () => { state.i++; save(); draw(); window.scrollTo(0,0); };
    document.getElementById("finish").onclick = () => {
      const missing = n - answered;
      if(missing && !confirm("You have "+missing+" unanswered question"+(missing>1?"s":"")+". Finish the exam anyway?")) return;
      finish();
    };
  };
  clearInterval(tick);
  if(left()===0) return finish();
  tick = setInterval(() => {
    const s = left(), c = document.getElementById("clock");
    if(c){ c.textContent = fmt(s); c.className = s<300 ? "low" : ""; }
    if(s<=0) finish();
  }, 1000);
  draw();
}

function examResult(state){
  clearInterval(tick);
  const byId = Object.fromEntries(examPool().map(q=>[q.id,q]));
  let score = 0; const per = {}, wrong = [];
  state.order.forEach((id,k) => {
    const q = byId[id], a = state.answers[id], ok = a===q.answer;
    const p = per[q.chTitle] = per[q.chTitle] || [0,0];
    p[1]++; if(ok){ score++; p[0]++; } else wrong.push({k,q,a});
  });
  const n = state.order.length, pct = Math.round(100*score/n);
  const mins = Math.max(1, Math.round(((state.finished||state.end)-state.start)/60000));
  if(!state.scored){
    state.scored = true;
    store.set("exam:state", state);
    store.set("exam:last", {score, total:n, date:new Date().toLocaleDateString()});
  }
  app.innerHTML = `<a href="#exam">Back to the exam page</a><h1>${score} of ${n} (${pct}%)</h1><p class="note">Time used: ${mins} minutes of 120.</p>
  <section class="panel"><h2>By chapter</h2>${Object.entries(per).map(([t,v])=>`<p>${t}: ${v[0]} of ${v[1]}</p>`).join("")}</section>
  <h2>${wrong.length ? "Questions to review ("+wrong.length+")" : "Perfect score"}</h2>
  ${wrong.map(w=>`<div class="panel rev"><p class="count">Question ${w.k+1}</p><p><strong>${w.q.q}</strong></p><p>Your answer: ${w.a===undefined ? "not answered" : w.q.options[w.a]}</p><p>Correct answer: ${w.q.options[w.q.answer]}</p><p class="note">${w.q.why}</p></div>`).join("")}`;
  window.scrollTo(0,0);
}

const EXAM_DATE = "2026-11-16"; // change to your exam day (YYYY-MM-DD)
const INTERVALS = [1,2,4]; // days until the next review after a correct answer, by box

const today = () => Math.floor((Date.now() - new Date().getTimezoneOffset()*60000) / 86400000);
function daysLeft(){
  const d = new Date(EXAM_DATE+"T00:00:00");
  if(isNaN(d)) return 0;
  const n = new Date(); n.setHours(0,0,0,0);
  return Math.round((d-n)/86400000);
}
function dailyItems(){
  const out = [];
  CHAPTERS.forEach(c => {
    (c.cards||[]).forEach((x,i) => out.push({id:c.id+":c"+i, kind:"card", ch:c.title, q:x.q, a:x.a}));
    (c.mc||[]).forEach((x,i) => out.push(Object.assign({id:c.id+":m"+i, kind:"mc", ch:c.title}, x)));
    (c.tf||[]).forEach((x,i) => out.push({id:c.id+":t"+i, kind:"mc", ch:c.title, q:x.q, options:["True","False"], answer:x.answer?0:1, why:x.why}));
    (c.practice||[]).forEach((x,i) => out.push(Object.assign({id:c.id+":p"+i, kind:"mc", ch:c.title}, x)));
  });
  return out;
}
function dailyState(){
  const S = store.get("daily:state") || {};
  S.items = S.items || {}; S.meta = S.meta || {day:0, newCount:0}; S.log = S.log || [];
  return S;
}
function streakOf(log,t){ let d = log.includes(t) ? t : t-1, n = 0; while(log.includes(d)){ n++; d--; } return n; }
function dailyPlan(){
  const S = dailyState(), all = dailyItems(), t = today(), dl = daysLeft();
  const fresh = all.filter(x => !S.items[x.id]);
  const made = S.meta.day===t ? S.meta.newCount : 0;
  const perDay = dl>1 ? Math.ceil((fresh.length+made)/(dl-1)) : 15;
  const due = all.filter(x => S.items[x.id] && S.items[x.id].due<=t);
  const newToday = fresh.slice(0, Math.max(0, perDay-made));
  const weak = all.filter(x => S.items[x.id] && S.items[x.id].miss>0 && S.items[x.id].box<3);
  const learned = all.filter(x => S.items[x.id] && S.items[x.id].box>=2).length;
  return {S, all, t, dl, due, newToday, weak, learned};
}

function daily(){
  const p = dailyPlan(), n = p.due.length + p.newToday.length, done = p.S.log.includes(p.t), st = streakOf(p.S.log,p.t);
  app.innerHTML = `<a href="#">All chapters</a><h1>Daily review</h1>
  <section class="panel">${p.dl>0 ? `<p><strong>Exam in ${p.dl} day${p.dl>1?"s":""}.</strong> New items are spread so everything is seen before then.</p>` : ""}
  <p>Streak: <strong>${st}</strong> day${st===1?"":"s"}. Learned so far: ${p.learned} of ${p.all.length}.</p>
  <p>${n ? `Today: ${p.due.length} to review and ${p.newToday.length} new.` : done ? "You’re done for today. Come back tomorrow." : "Nothing is due right now."}</p>
  <div class="row">${n ? `<button class="primary" id="go">Start today’s review</button>` : ""}${p.weak.length ? `<button id="weak">Practice my weak items (${p.weak.length})</button>` : ""}</div>
  <p class="note">Items you get right come back after 1, 2 and then 4 days. Items you miss come back tomorrow and again later today.</p></section>`;
  const go = document.getElementById("go"); if(go) go.onclick = () => dailySession(p.due.concat(p.newToday), p, true);
  const wk = document.getElementById("weak"); if(wk) wk.onclick = () => dailySession(p.weak, p, false);
}

function dailySession(queue, p, isDaily){
  const S = p.S, t = p.t, total = queue.length;
  const q = shuffle(queue).map(item => ({item, retry:false}));
  let firstTry = 0;
  const save = () => store.set("daily:state", S);
  const record = (e, ok) => {
    const id = e.item.id;
    if(!S.items[id]){
      S.items[id] = {box:0, due:t, miss:0};
      if(S.meta.day!==t) S.meta = {day:t, newCount:0};
      S.meta.newCount++;
    }
    const s = S.items[id];
    if(!e.retry){
      if(ok){ s.box = Math.min(s.box+1,3); s.due = t + INTERVALS[s.box-1]; firstTry++; }
      else { s.box = 0; s.due = t+1; s.miss++; }
    }
    q.shift();
    if(!ok) q.push({item:e.item, retry:true});
    save();
  };
  const finish = () => {
    if(isDaily && !S.log.includes(t)) S.log.push(t);
    save();
    const tomorrow = p.all.filter(x => S.items[x.id] && S.items[x.id].due<=t+1).length;
    app.innerHTML = `<a href="#daily">Back to Daily review</a><h1>${isDaily ? "Done for today" : "Practice finished"}</h1>
    <section class="panel"><p>You got ${firstTry} of ${total} right on the first try.</p>
    ${isDaily ? `<p>Streak: <strong>${streakOf(S.log,t)}</strong> day${streakOf(S.log,t)===1?"":"s"}.</p>` : ""}
    <p>${tomorrow} item${tomorrow===1?"":"s"} will be due tomorrow.</p></section>`;
    window.scrollTo(0,0);
  };
  const show = () => {
    if(!q.length) return finish();
    const e = q[0], x = e.item;
    const head = `<p class="count">${x.ch}${e.retry ? ", second try" : ""}. ${q.length} left.</p>`;
    if(x.kind==="card"){
      let back = false;
      const draw = () => {
        app.innerHTML = `<a href="#daily">Stop for now</a><section class="panel">${head}
        <button class="card ${back?"back":""}" id="flip" aria-label="Flip card">${back?x.a:x.q}</button>
        ${back ? `<p class="note">Did you get it right?</p><div class="row"><button id="miss">I got it wrong</button><button id="hit" class="primary">I got it right</button></div>` : `<p class="note">Think of the answer, then tap the card to flip it.</p>`}</section>`;
        document.getElementById("flip").onclick = () => { back = !back; draw(); };
        if(back){
          document.getElementById("hit").onclick = () => { record(e,true); show(); };
          document.getElementById("miss").onclick = () => { record(e,false); show(); };
        }
      };
      draw();
    } else {
      const base = x.options.map((t2,i) => ({t:t2, ok:i===x.answer}));
      const fixed = x.options.length===2 || x.options.some(t2 => /\b(above|these|first two)\b|^(none|all|both) of/i.test(t2));
      const o = fixed ? base : shuffle(base);
      app.innerHTML = `<a href="#daily">Stop for now</a><section class="panel">${head}<h2>${x.q}</h2>
      <div class="opts">${o.map((y,k)=>`<button data-n="${k}">${y.t}</button>`).join("")}</div><div id="fb" aria-live="polite"></div></section>`;
      const btns = app.querySelectorAll(".opts button");
      btns.forEach((b,k) => b.onclick = () => {
        btns.forEach((bb,j) => { bb.disabled = true; if(o[j].ok) bb.classList.add("right"); });
        const ok = o[k].ok;
        if(!ok) b.classList.add("wrong");
        document.getElementById("fb").innerHTML = `<p><strong>${ok?"Correct.":"Not quite."}</strong> ${x.why}</p><button class="primary" id="nx">Next</button>`;
        document.getElementById("nx").onclick = () => { record(e,ok); show(); };
      });
    }
  };
  show();
}

function route(){
  clearInterval(tick);
  const [id,tab] = location.hash.slice(1).split("/");
  if(id==="exam"){ examHome(); window.scrollTo(0,0); return; }
  if(id==="daily"){ daily(); window.scrollTo(0,0); return; }
  const ch = CHAPTERS.find(c=>c.id===id);
  ch ? chapter(ch, tab||"summary") : home();
  window.scrollTo(0,0);
}
window.addEventListener("hashchange", route);
route();

</script>
